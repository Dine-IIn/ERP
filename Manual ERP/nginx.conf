# Nginx Production Virtual Host Configuration for ERP System
# Matches: https://erp.anbindustries.com

# 1. HTTP to HTTPS global redirect
server {
    listen 80;
    listen [::]:80;
    server_name erp.anbindustries.com;

    # Let's Encrypt Certbot validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Secure HTTPS Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.anbindustries.com;

    # SSL Certbot Certificates
    ssl_certificate /etc/letsencrypt/live/erp.anbindustries.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.anbindustries.com/privkey.pem;

    # Highly-hardened SSL security profiles
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Proxy to Node.js backend cluster running locally on Port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # Real-time WebSocket support (Crucial for Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass headers to support Node.js reverse-proxy checks
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for persistent WebSockets connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Optimize serving of uploaded files directly via Nginx (Bypasses Node.js overhead)
    location /uploads/ {
        alias /home/ubuntu/erp/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Backup download security restriction (Requires authorization token inside Nginx if needed)
    location /backups/ {
        alias /home/ubuntu/erp/backend/backups/;
        internal; # Restricts direct browser accessing without backend redirection
    }

    # Client-side SPA routing fallback (Optional if front-end is also self-hosted)
    # location /app/ {
    #     root /var/www/erp/frontend;
    #     try_files $uri $uri/ /index.html;
    # }
}
