name: "Build & Release (Windows, macOS, Android, iOS)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Desktop Builds: Windows (.msi / .exe) & macOS (.dmg)
  # -------------------------------------------------------------
  build-tauri-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Corepack & PNPM
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build Tauri Desktop Application
        uses: tauri-apps/action-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.ref_name }}
          releaseName: "ERP App Release ${{ github.ref_name }}"
          releaseBody: "Automated multi-platform standalone release for Windows, macOS, Android, and iOS."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # -------------------------------------------------------------
  # 2. Android Mobile Build (.apk)
  # -------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Corepack & PNPM
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies & sync Capacitor Android
        run: |
          cd frontend
          pnpm install
          pnpm build
          npx cap sync android || true

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # 3. iOS Mobile Build (.ipa)
  # -------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Corepack & PNPM
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies & sync Capacitor iOS
        run: |
          cd frontend
          pnpm install
          pnpm build
          npx cap sync ios || true

      - name: Build iOS App Archive via Xcode
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath build/App.xcarchive || true
          cd build
          zip -r App.ipa App.xcarchive || true

      - name: Upload iOS Build Archive to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend/ios/App/build/App.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
