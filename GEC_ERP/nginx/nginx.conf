# ====================================================================
# GEC ERP - NGINX SSL REVERSE PROXY CONFIGURATION
# Domain: erpdev.manavkalola.xyz -> Backend: http://127.0.0.1:5000
# ====================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 50MB Upload and Request Body Limit (for bulk ERP sync and document attachments)
    client_max_body_size 50M;

    # ================================================================
    # 1. HTTP Server - Port 80 (Redirects to HTTPS + ACME Challenge)
    # ================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name erpdev.manavkalola.xyz erp.manavkalola.xyz localhost;

        # Let's Encrypt / Certbot ACME Webroot verification path
        location /.well-known/acme-challenge/ {
            root D:/ERP/GEC_ERP/nginx/certbot_webroot;
        }

        # Automatic redirect of all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================================================================
    # 2. HTTPS Server - Port 443 (SSL Termination & Proxy to Node.js)
    # ================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name erpdev.manavkalola.xyz erp.manavkalola.xyz;

        # SSL Certificates (Managed by Certbot / Let's Encrypt or local SSL)
        ssl_certificate     D:/ERP/GEC_ERP/nginx/ssl/fullchain.pem;
        ssl_certificate_key D:/ERP/GEC_ERP/nginx/ssl/privkey.pem;

        # Modern TLS Security Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Root Reverse Proxy to GEC ERP Node.js Backend (Port 5000)
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;

            # WebSocket & Hot-Reload Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Client & Proxy Information Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts for Long-Running Sync and Backup Operations
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Error Pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
