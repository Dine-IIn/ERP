name: enterprise_erp
description: Enterprise-grade ERP System with multi-platform support
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ==========================================
  # UI & DESIGN
  # ==========================================
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1

  # ==========================================
  # STATE MANAGEMENT
  # ==========================================
  provider: ^6.1.5
  get: ^4.7.2

  # ==========================================
  # HTTP & API
  # ==========================================
  http: ^1.4.0
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.3
  socket_io_client: ^3.1.2

  # ==========================================
  # STORAGE
  # ==========================================
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  jwt_decoder: ^2.0.1
  crypto: ^3.0.6

  # ==========================================
  # FORMS & VALIDATION
  # ==========================================
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0

  # ==========================================
  # DATE & TIME
  # ==========================================
  time: ^2.1.5

  # ==========================================
  # FILE HANDLING
  # ==========================================
  file_picker: ^10.2.0
  image_picker: ^1.1.2
  open_file: ^3.5.10
  path: ^1.9.1

  # ==========================================
  # PDF & DOCUMENTS
  # ==========================================
  pdf: ^3.11.3
  printing: ^5.14.2

  syncfusion_flutter_pdf: ^29.2.11
  syncfusion_flutter_xlsio: ^29.2.11
  syncfusion_flutter_charts: ^29.2.11

  # ==========================================
  # QR & BARCODE
  # ==========================================
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^7.0.1

  # ==========================================
  # NOTIFICATIONS
  # ==========================================
  flutter_local_notifications: ^19.4.0

  # ==========================================
  # UTILITIES
  # ==========================================
  uuid: ^4.5.1
  logger: ^2.6.0
  url_launcher: ^6.3.2
  share_plus: ^11.0.0
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1
  permission_handler: ^12.0.1

  # ==========================================
  # DESKTOP SUPPORT
  # ==========================================
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ==========================================
  # HIVE CODE GENERATION
  # ==========================================
  hive_generator: ^2.0.1

  # IMPORTANT:
  # 2.4.13 is stable with hive_generator
  build_runner: ^2.4.13

  # ==========================================
  # APP ICONS
  # ==========================================
  flutter_launcher_icons: ^0.14.4

  # ==========================================
  # SPLASH SCREEN
  # ==========================================
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

#   fonts:
#     - family: CustomIcon
#       fonts:
#         - asset: assets/fonts/CustomIcon.ttf

# ==========================================
# SPLASH SCREEN CONFIG
# ==========================================
flutter_native_splash:
  color: "#6366F1"

  image: assets/images/splash_logo.png

  android: true
  ios: true
  web: false
  windows: false
  macos: false

# ==========================================
# APP ICON CONFIG
# ==========================================
flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/icons/app_icon.png

  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 256

  macos:
    generate: true
    image_path: assets/icons/app_icon.png